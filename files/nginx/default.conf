# ==========================================================
# CONFIGURACIÓN OPTIMIZADA EXTAGRAM (FIX CHROME & GOOGLE)
# ==========================================================

upstream php_backend {
    ip_hash;            
    server s2_extagram:9000;
    server s3_extagram:9000;
    keepalive 32;
}

upstream upload_node {
    server s4_upload:9000;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name g5asixc2bc.com www.g5asixc2bc.com;

    root /var/www/html;
    index extagram.php index.php;

    # SSL Config
    ssl_certificate /etc/letsencrypt/live/g5asixc2bc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/g5asixc2bc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logs
    access_log /var/log/nginx/extagram_access.log;
    error_log /var/log/nginx/extagram_error.log warn;

    # ==========================================================
    # FIX 1: AUMENTAR BUFFERS PARA GOOGLE OAUTH
    # ==========================================================
    # Google envía cabeceras gigantes. Si esto es bajo, da error 502 en Chrome.
    fastcgi_buffers 64 64k;       ### NEW: Aumentado de 16k
    fastcgi_buffer_size 128k;     ### NEW: Aumentado de 32k
    fastcgi_busy_buffers_size 128k; 
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ==========================================================
    # SEGURIDAD DASHBOARD
    # ==========================================================
    location = /dashboard.php {
        auth_basic "Acceso Restringido - Demo Seguridad";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        include fastcgi_params;
        fastcgi_pass php_backend; 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Importante para que PHP sepa que es HTTPS tras el auth basic
        fastcgi_param HTTPS on; 
    }

    # Grafana Proxy
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
    }

    # ==========================================================
    # FIX 2: NO CACHEAR PROFILE NI CALLBACK
    # ==========================================================
    # Chrome a veces cachea la redirección del login y crea un bucle.
    location ~ /(profile|google-callback|login)\.php$ {
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;  ### NEW: Obligatorio para cookies Secure
        
        # Desactivar caché de navegador para estas páginas críticas
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # RUTAS GENERALES PHP
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php_backend;
        fastcgi_index extagram.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # FIX 3: INFORMAR A PHP DE HTTPS
        fastcgi_param HTTPS on;  ### NEW: Vital para session.cookie_secure
        fastcgi_param REQUEST_SCHEME https;
        
        fastcgi_read_timeout 60;
        fastcgi_keep_conn on;
    }

    # STATIC FILES
    location ~* \.(css|js|svg|jpg|jpeg|png|gif|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # UPLOAD NODE
    location = /upload.php {
        include fastcgi_params;
        fastcgi_pass upload_node; 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on; ### NEW
        client_max_body_size 50M;
        fastcgi_read_timeout 600;
    }

    location /uploads/ {
        alias /var/www/html/uploads/;
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /extagram.php?$query_string;
    }

    location ~ /\.(ht|git|db|env) {
        deny all;
    }

    error_page 404 /error.php;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name g5asixc2bc.com www.g5asixc2bc.com;
    return 301 https://$host$request_uri;
}
