services:
  # S1: Balanceador Nginx
  s1_nginx:
    container_name: s1_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./files/etc/nginx/extagram:/etc/nginx/conf.d/default.conf:ro
      - ./files/etc/letsencrypt:/etc/letsencrypt:ro
      - ./public:/var/www/html:ro
    depends_on:
      - s2_extagram
      - s3_extagram
    restart: always

  # S2 y S3: PHP-FPM con Driver MySQL instalado mediante Dockerfile
  s2_extagram:
    container_name: s2_extagram
    build: .
    volumes:
      - ./public:/var/www/html
      - ./files/etc/php/8.3/fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    restart: always

  s3_extagram:
    container_name: s3_extagram
    build: .
    volumes:
      - ./public:/var/www/html
      - ./files/etc/php/8.3/fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    restart: always

  # S4: Servidor dedicado para subidas con Driver MySQL
  s4_upload:
    container_name: s4_upload
    build: .
    volumes:
      - ./public:/var/www/html
    restart: always

  # S5 y S6: Estáticos
  s5_nginx:
    container_name: s5_nginx
    image: nginx:alpine
    volumes:
      - ./public/uploads:/usr/share/nginx/html:ro
    restart: always

  s6_nginx:
    container_name: s6_nginx
    image: nginx:alpine
    volumes:
      - ./public/static:/usr/share/nginx/html:ro
    restart: always

  # S7: MySQL
  s7_mysql:
    container_name: s7_mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: extagram
    volumes:
      - ./files/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./mysql_data:/var/lib/mysql
    restart: always

  # S8: Redis
  s8_redis:
    container_name: s8_redis
    image: redis:alpine
    restart: always

networks:
  default:
    name: extagram_network
