x-php-base: &php_base
  build: .
  user: "root:root"
  restart: always
  cap_add:
    - SYS_PTRACE
    - DAC_READ_SEARCH
  volumes:
    - ./public:/var/www/html
    - ./public/uploads:/var/www/html/uploads
    - ./files/etc/letsencrypt:/etc/letsencrypt:ro
    - ./files/etc/php/8.3/fpm/php.ini:/usr/local/etc/php/conf.d/custom.ini
    - /var/log/auth.log:/var/log/auth.log:ro
    - /var/log/syslog:/var/log/syslog:ro
    - /var/log/fail2ban.log:/var/log/fail2ban.log:ro
    - /var/log/ufw.log:/var/log/ufw.log:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /usr/bin/docker:/usr/bin/docker:ro
    - /var/log/nginx:/var/log/nginx:ro
    - /var/log/syslog:/var/log/syslog:ro
    - /var/log/auth.log:/var/log/auth.log:ro
    - /proc:/host/proc:ro
    - /etc:/host/etc:ro
    - /sys:/host/sys:ro
  depends_on:
    - s8_redis
    - s7_mysql
  networks:
    - extagram_net

services:
  s1_nginx:
    container_name: s1_nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./files/nginx/extagram:/etc/nginx/conf.d/extagram.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ./files/etc/letsencrypt:/etc/letsencrypt:ro
      - ./files/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./public:/var/www/html:ro
    networks:
      - extagram_net
    restart: always

  s2_extagram:
    <<: *php_base
    container_name: s2_extagram
    environment:
      - NODE_NAME=s2_extagram

  s3_extagram:
    <<: *php_base
    container_name: s3_extagram
    environment:
      - NODE_NAME=s3_extagram

  s4_upload:
    <<: *php_base
    container_name: s4_upload
    cap_drop:
      - ALL
    environment:
      - NODE_NAME=s4_upload_engine

  s5_nginx:
    container_name: s5_nginx
    image: nginx:alpine
    volumes:
      - ./public/uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - extagram_net
    restart: always

  s6_nginx:
    container_name: s6_nginx
    image: nginx:alpine
    volumes:
      - ./public/static:/usr/share/nginx/html/static:ro
    networks:
      - extagram_net
    restart: always

  s7_mysql:
    container_name: s7_mysql
    image: mysql:8.0
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --local-infile=0
      - --skip-show-database
      - --symbolic-links=0
    environment:
      - MYSQL_ROOT_PASSWORD=Extagram_Secure_Root_2026!
      - MYSQL_DATABASE=extagram_db
      - MYSQL_USER=extagram_admin
      - MYSQL_PASSWORD=User_Secure_Pass_99!
    volumes:
      - ./files/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    networks:
      - extagram_net
    restart: always

  s8_redis:
    container_name: s8_redis
    image: redis:alpine
    command: redis-server --requirepass Redis_Pass_2026!
    networks:
      - extagram_net
    restart: always

  grafana:
    container_name: s9_grafana
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_storage:/var/lib/grafana
    networks:
      - extagram_net
    restart: always

volumes:
  grafana_storage:
  mysql_data:

networks:
  extagram_net:
    driver: bridge
